<!DOCTYPE html>
<html>
{{ template "header" . }}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <title>用户登录/注册</title>
</head>
<body>
    <div class="container mx-auto p-4">
        <ul class="flex space-x-4 mb-4">
            <li><a href="loginIndex" class="text-gray-600 hover:text-gray-900">登录</a></li>
            <li><a href="register" class="text-gray-600 hover:text-gray-900">注册</a></li>
            <li><a href="resetPassword" class="text-gray-600 hover:text-gray-900">重置密码</a></li>
        </ul>
        <div id="wechat-login" class="hidden text-center mb-4">
            <p class="text-gray-600">检测到您正在使用微信浏览器，点击下方按钮使用微信登录。</p>
            <button onclick="wechatLogin()" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded mt-2">微信登录</button>
        </div>
        <div id="login">
            <form>
                <div class="mb-4">
                    <input type="text" name="mob" class="border border-gray-300 p-2 w-full" placeholder="手机号码">
                </div>
                <div class="mb-4">
                    <input type="password" name="pwd" class="border border-gray-300 p-2 w-full" placeholder="密码">
                </div>
                <div class="mb-4">
                    <input type="checkbox" id="saveAccount" class="mr-1" checked>
                    <label for="saveAccount" class="text-gray-600">保存账号密码</label>
                </div>
                <button id="userLogin" type="button" class="bg-gray-800 hover:bg-gray-900 text-white py-2 px-4 w-full rounded">登录</button>
            </form>
        </div>
    </div>
    {{ template "copyright" . }}
    {{ template "menu" . }}
    <script src="static/date/jquery.min.js"></script>
    <script src="static/date/bootstrap.min.js"></script>
    <script>
        function setupCaptchaButton() {
            $("#captchaBtn").click(function (e) {
                $.get('mob_code.php?type=' + $(this).attr("code-type") + '&mob=' + $("#registerMob").val())
                  .done(function (data) {
                        if (data.code !== 0) {
                            alert(data.msg);
                        } else {
                            $(this).attr("disabled", true);
                            let s = 60;
                            $("#captchaBtn").html(s-- + "s");
                            let timer = setInterval(function () {
                                if (s === 0) {
                                    clearInterval(timer);
                                    $("#captchaBtn").attr("disabled", false).html('获取验证码');
                                } else {
                                    $("#captchaBtn").html(s-- + "s");
                                }
                            }, 1000);
                        }
                    })
                  .fail(function () {
                        alert('请求验证码失败，请稍后再试。');
                    });
            });
        }

        function populateSavedAccount() {
            var account = localStorage.getItem('account');
            if (account) {
                account = JSON.parse(account);
                $("#login input[name=mob]").val(account.mob);
                $("#login input[name=pwd]").val(account.pwd);
            }
        }

        function setupUserLogin() {
            $("#userLogin").click(function () {
                var username = $("#login input[name=mob]").val();
                var password = $("#login input[name=pwd]").val();
                $.post("userLogin", {
                    pwd: password,
                    mob: username
                })
                  .done(function (data) {
                        if (data.msg === 'success') {
                            window.location.href = 'record';
                        } else if (data.msg === '用户名或密码错误') {
                            alert('登录失败，请检查用户名和密码。');
                        } else if (data.msg === '手机号不存在') {
                            alert('手机号不存在！');
                        } else {
                            alert('服务器无响应，请稍后再试。');
                        }
                    })
                  .fail(function () {
                        alert('登录请求失败，请稍后再试。');
                    });
            });
        }

        function detectWechatBrowser() {
            function isWechatBrowser() {
                const ua = navigator.userAgent.toLowerCase();
                return ua.match(/MicroMessenger/i) === "micromessenger";
            }

            if (!isWechatBrowser()) {
                document.getElementById('wechat-login').classList.remove('hidden');
            }
        }

        function wechatLogin() {
            // 判断是否在微信浏览器中
            function isWechatBrowser() {
                const ua = navigator.userAgent.toLowerCase();
                return ua.match(/MicroMessenger/i) === "micromessenger";
            }

            if (isWechatBrowser()) {
                // 微信环境下，使用扫码登录
                // 引入微信官方的 wxLogin.js 文件
                const script = document.createElement('script');
                script.src = 'https://res.wx.qq.com/connect/zh_CN/htmledition/js/wxLogin.js';
                document.head.appendChild(script);

                // 创建 WxLogin 对象，配置相关参数
                const wxLogin = new WxLogin({
                    id: 'wxLoginContainer', // 二维码显示容器的id
                    appid: '你的AppID', // 从微信开放平台获取的AppID
                    scope:'snsapi_login', // 授权作用域，固定值
                    redirect_uri: encodeURI('你的重定向网址'), // 扫码后跳转的页面
                    state: '自定义状态值', // 用于保持请求和回调的状态
                    style: 'black', // 二维码黑白风格
                    href: ''
                });
            } else {
                // 非微信环境下，直接调起微信登录
                const appid = '你的AppID';
                const redirect_uri = encodeURI('你的重定向网址');
                const state = '自定义状态值';
                const authorizeUrl = `https://open.weixin.qq.com/connect/oauth2/authorize?appid=${appid}&redirect_uri=${redirect_uri}&response_type=code&scope=snsapi_userinfo&state=${state}#wechat_redirect`;
                window.location.href = authorizeUrl;
            }
        }

        $(document).ready(function () {
            setupCaptchaButton();
            populateSavedAccount();
            setupUserLogin();
            detectWechatBrowser();
        });
    </script>
    <div class="mpa-sc mpa-plugin-image-gatherer mpa-new mpa-rootsc" data-z="100" style="display: block;" id="mpa-rootsc-image-gatherer"></div>
    <div class="mpa-sc mpa-plugin-text-gatherer mpa-new mpa-rootsc" data-z="100" style="display: block;" id="mpa-rootsc-text-gatherer"></div>
    <div class="mpa-sc mpa-plugin-video-gatherer mpa-new mpa-rootsc" data-z="100" style="display: block;" id="mpa-rootsc-video-gatherer"></div>
</body>
</html>
